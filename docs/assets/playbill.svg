<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="The cast: you are the lead, Gemini is the understudy, the SOP is the script, Model Armor is stage security, Mission Control is the director, Cloud Run is the stage, Firestore and Cloud Storage are the archive, the benchmark is the critic">
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .row{animation:fade 16s infinite both}
      .r1{animation-delay:.2s}.r2{animation-delay:.5s}.r3{animation-delay:.8s}.r4{animation-delay:1.1s}
      .r5{animation-delay:1.4s}.r6{animation-delay:1.7s}.r7{animation-delay:2s}.r8{animation-delay:2.3s}
      @keyframes fade{0%{opacity:0}5%,92%{opacity:1}100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.row{animation:none;opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="500" rx="20" fill="#F7F1E3"/>
  <rect x="14" y="14" width="1172" height="472" rx="12" fill="none" stroke="#8E1426" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="456" rx="8" fill="none" stroke="#8E1426" stroke-width="1" stroke-dasharray="2 4"/>

  <text x="600" y="72" text-anchor="middle" class="t" font-size="13" font-weight="700" letter-spacing="6" fill="#8E1426">PLAYBILL</text>
  <text x="600" y="118" text-anchor="middle" class="serif" font-size="40" font-style="italic" fill="#1B1B1B">Understudy</text>
  <text x="600" y="146" text-anchor="middle" class="t" font-size="14" letter-spacing="2" fill="#5A5A5A">A PLAY IN FIVE ACTS: WATCH · GOVERN · BUILD · EXECUTE · EXPORT</text>
  <path d="M440 168 H760" stroke="#8E1426" stroke-width="1.5"/>
  <text x="600" y="198" text-anchor="middle" class="t" font-size="12" font-weight="700" letter-spacing="5" fill="#8E1426">THE CAST</text>

  <g class="t" font-size="18">
    <!-- left column -->
    <g class="row r1"><text x="90" y="250" font-weight="700" fill="#1B1B1B">The Lead</text><path d="M186 246 H255" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="560" y="250" text-anchor="end" fill="#3A3A3A">You - the one who knows the job</text></g>
    <g class="row r2"><text x="90" y="300" font-weight="700" fill="#1B1B1B">The Understudy</text><path d="M247 296 H363" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="560" y="300" text-anchor="end" fill="#4285F4" font-weight="700">Gemini on Vertex AI</text></g>
    <g class="row r3"><text x="90" y="350" font-weight="700" fill="#1B1B1B">The Script</text><path d="M206 346 H291" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="560" y="350" text-anchor="end" fill="#3A3A3A">Your SOP, as enforced rules</text></g>
    <g class="row r4"><text x="90" y="400" font-weight="700" fill="#1B1B1B">Stage Security</text><path d="M247 396 H435" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="560" y="400" text-anchor="end" fill="#EA4335" font-weight="700">Model Armor</text></g>
    <!-- right column -->
    <g class="row r5"><text x="640" y="250" font-weight="700" fill="#1B1B1B">The Director</text><path d="M776 246 H949" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="1110" y="250" text-anchor="end" fill="#3A3A3A">Mission Control</text></g>
    <g class="row r6"><text x="640" y="300" font-weight="700" fill="#1B1B1B">The Stage</text><path d="M746 296 H1003" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="1110" y="300" text-anchor="end" fill="#34A853" font-weight="700">Cloud Run</text></g>
    <g class="row r7"><text x="640" y="350" font-weight="700" fill="#1B1B1B">The Archive</text><path d="M766 346 H859" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="1110" y="350" text-anchor="end" fill="#B07D00" font-weight="700">Firestore · Cloud Storage</text></g>
    <g class="row r8"><text x="640" y="400" font-weight="700" fill="#1B1B1B">The Critic</text><path d="M756 396 H787" stroke="#B8A98A" stroke-dasharray="2 5"/><text x="1110" y="400" text-anchor="end" fill="#3A3A3A">a benchmark that reads the ledger</text></g>
  </g>

  <text x="600" y="456" text-anchor="middle" class="serif" font-size="16" font-style="italic" fill="#5A5A5A">"Learns the role by watching the lead once - then performs it every night, by the script, with receipts."</text>
</svg>
