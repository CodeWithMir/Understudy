<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Understudy - the curtain opens: Show it once. Get automation you can trust.">
  <defs>
    <clipPath id="frame"><rect width="1200" height="480" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- velvet: one soft fold, repeated -->
    <linearGradient id="fold" x1="0" x2="1">
      <stop offset="0" stop-color="#2B0711"/>
      <stop offset="0.28" stop-color="#5E1222"/>
      <stop offset="0.5" stop-color="#8C2236"/>
      <stop offset="0.72" stop-color="#5E1222"/>
      <stop offset="1" stop-color="#2B0711"/>
    </linearGradient>
    <pattern id="velvet" width="64" height="480" patternUnits="userSpaceOnUse">
      <rect width="64" height="480" fill="url(#fold)"/>
    </pattern>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sheenR" x1="1" x2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#8A6A2A"/><stop offset="0.5" stop-color="#E6C878"/><stop offset="1" stop-color="#8A6A2A"/>
    </linearGradient>

    <!-- stage -->
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7CEE6"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset="0.25" stop-color="#FBBC04"/>
      <stop offset="0.5" stop-color="#34A853"/><stop offset="0.75" stop-color="#EA4335"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cone" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#FFF4D8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFF4D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF4D8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFF4D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121830"/><stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <radialGradient id="comet">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFE7A8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
      /* curtains gather to the sides once, then stay open */
      .cl{transform-origin:0 0;animation:gather 2.8s cubic-bezier(.65,0,.25,1) .5s both}
      .cr{transform-origin:1200px 0;animation:gather 2.8s cubic-bezier(.65,0,.25,1) .5s both}
      @keyframes gather{from{transform:scaleX(1)}to{transform:scaleX(.13)}}
      .light{animation:on 2.4s ease-out 1.4s both}
      @keyframes on{from{opacity:0}to{opacity:1}}
      .rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
      .r1{animation-delay:1.9s}.r2{animation-delay:2.2s}.r3{animation-delay:2.5s}.r4{animation-delay:2.9s}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .a1{animation:d1 18s ease-in-out infinite alternate}.a2{animation:d2 22s ease-in-out infinite alternate}
      @keyframes d1{to{transform:translate(120px,30px)}}@keyframes d2{to{transform:translate(-140px,-20px)}}
      .breath{animation:br 7s ease-in-out 4s infinite}
      @keyframes br{50%{opacity:.6}}
      @media (prefers-reduced-motion: reduce){
        .cl,.cr{animation:none;transform:scaleX(.13)}
        .light,.rise,.a1,.a2,.breath{animation:none;opacity:1}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- the stage behind the curtain -->
    <rect width="1200" height="480" fill="#070A14"/>
    <g filter="url(#blur)" opacity="0.6">
      <ellipse class="a1" cx="360" cy="150" rx="240" ry="110" fill="#4285F4" fill-opacity="0.35"/>
      <ellipse class="a2" cx="860" cy="140" rx="230" ry="110" fill="#A78BFA" fill-opacity="0.30"/>
    </g>
    <rect y="372" width="1200" height="108" fill="url(#floor)"/>
    <path d="M0 372 H1200" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <g class="light">
      <polygon class="breath" points="530,0 670,0 930,400 270,400" fill="url(#cone)"/>
      <ellipse cx="600" cy="398" rx="360" ry="34" fill="url(#pool)"/>
    </g>

    <!-- the performance -->
    <g class="sans" text-anchor="middle">
      <g class="rise r1">
        <text x="600" y="104" font-size="12.5" font-weight="600" letter-spacing="4.5" fill="#E6C878">NOW PLAYING  ·  GOOGLE CLOUD AI BUILDER CUP 2026</text>
      </g>
      <g class="rise r2">
        <text x="600" y="208" font-size="100" font-weight="700" letter-spacing="-3" fill="url(#title)">Understudy</text>
      </g>
      <g class="rise r3">
        <text x="600" y="256" font-size="24" fill="#B4BDD6">Watches you perform a task once. Then performs it - by the rules, with proof.</text>
      </g>
      <g class="rise r4">
        <path d="M300 322 H900" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
        <path d="M300 322 H900" stroke="url(#line)" stroke-width="2"/>
        <circle cx="300" cy="322" r="5" fill="#4285F4"/><circle cx="450" cy="322" r="5" fill="#FBBC04"/>
        <circle cx="600" cy="322" r="5" fill="#34A853"/><circle cx="750" cy="322" r="5" fill="#EA4335"/>
        <circle cx="900" cy="322" r="5" fill="#A78BFA"/>
        <circle r="13" fill="url(#comet)" filter="url(#soft)">
          <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M300 322 H900" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.75;0.8;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
        </circle>
        <g font-size="11.5" font-weight="600" letter-spacing="3" fill="#8D97B5">
          <text x="300" y="352">WATCH</text><text x="450" y="352">GOVERN</text><text x="600" y="352">BUILD</text>
          <text x="750" y="352">EXECUTE</text><text x="900" y="352">EXPORT</text>
        </g>
        <text x="600" y="440" class="serif" font-size="16" font-style="italic" fill="#8D97B5">A production by Team JAAAR, starring Gemini on Vertex AI</text>
      </g>
    </g>

    <!-- curtains -->
    <g class="cl">
      <path d="M0 0 H612 V466 Q306 480 0 470 Z" fill="url(#velvet)"/>
      <path d="M0 0 H612 V466 Q306 480 0 470 Z" fill="url(#depth)"/>
      <path d="M0 0 H612 V466 Q306 480 0 470 Z" fill="url(#sheenL)"/>
    </g>
    <g class="cr">
      <path d="M588 0 H1200 V470 Q894 480 588 466 Z" fill="url(#velvet)"/>
      <path d="M588 0 H1200 V470 Q894 480 588 466 Z" fill="url(#depth)"/>
      <path d="M588 0 H1200 V470 Q894 480 588 466 Z" fill="url(#sheenR)"/>
    </g>

    <!-- gold tie-backs, appear once the curtains are gathered -->
    <g class="light">
      <rect x="-6" y="292" width="92" height="7" rx="3.5" fill="url(#gold)"/>
      <circle cx="84" cy="296" r="6" fill="#E6C878"/>
      <rect x="1114" y="292" width="92" height="7" rx="3.5" fill="url(#gold)"/>
      <circle cx="1116" cy="296" r="6" fill="#E6C878"/>
    </g>

    <!-- valance with swags and a fine gold trim -->
    <path d="M0 0 H1200 V30 H0 Z" fill="#3A0A15"/>
    <path d="M0 30 Q100 66 200 30 Q300 66 400 30 Q500 66 600 30 Q700 66 800 30 Q900 66 1000 30 Q1100 66 1200 30 V0 H0 Z" fill="#4A0D1B"/>
    <path d="M0 30 Q100 66 200 30 Q300 66 400 30 Q500 66 600 30 Q700 66 800 30 Q900 66 1000 30 Q1100 66 1200 30 V0 H0 Z" fill="url(#depth)" opacity="0.6"/>
    <path d="M0 30 Q100 66 200 30 Q300 66 400 30 Q500 66 600 30 Q700 66 800 30 Q900 66 1000 30 Q1100 66 1200 30" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <g fill="#E6C878"><circle cx="200" cy="31" r="3"/><circle cx="400" cy="31" r="3"/><circle cx="600" cy="31" r="3"/><circle cx="800" cy="31" r="3"/><circle cx="1000" cy="31" r="3"/></g>

    <rect x="0.5" y="0.5" width="1199" height="479" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
</svg>
