<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 64" width="760" height="64" role="img" aria-label="Watches you do it once. Turns your SOP into rules. Writes the code. Heals itself. Ships only what worked.">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:24px;font-weight:600}@keyframes k0{0%{width:0}0.00%{width:0}8.75%{width:344px}16.88%{width:344px}19.38%{width:0}100%{width:0}}.c0{animation:k0 16.0s steps(23,end) infinite}@keyframes k1{0%{width:0}20.00%{width:0}28.75%{width:604px}36.88%{width:604px}39.38%{width:0}100%{width:0}}.c1{animation:k1 16.0s steps(41,end) infinite}@keyframes k2{0%{width:0}40.00%{width:0}48.75%{width:532px}56.88%{width:532px}59.38%{width:0}100%{width:0}}.c2{animation:k2 16.0s steps(36,end) infinite}@keyframes k3{0%{width:0}60.00%{width:0}68.75%{width:503px}76.88%{width:503px}79.38%{width:0}100%{width:0}}.c3{animation:k3 16.0s steps(34,end) infinite}@keyframes k4{0%{width:0}80.00%{width:0}88.75%{width:445px}96.88%{width:445px}99.38%{width:0}100%{width:0}}.c4{animation:k4 16.0s steps(30,end) infinite}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.c0{animation:none;width:700px}[class^=c]:not(.c0){animation:none}}</style>
<rect width="760" height="64" rx="14" fill="#0B1020"/>
<text x="16" y="42" fill="#22D3EE">›</text>
<clipPath id="cp0"><rect class="c0" x="40" y="12" height="40" width="0"/></clipPath><text clip-path="url(#cp0)" x="40" y="42" fill="#4285F4">Watches you do it once.</text><clipPath id="cp1"><rect class="c1" x="40" y="12" height="40" width="0"/></clipPath><text clip-path="url(#cp1)" x="40" y="42" fill="#FBBC04">Turns your SOP into rules it can't break.</text><clipPath id="cp2"><rect class="c2" x="40" y="12" height="40" width="0"/></clipPath><text clip-path="url(#cp2)" x="40" y="42" fill="#34A853">Writes the code. Proves every click.</text><clipPath id="cp3"><rect class="c3" x="40" y="12" height="40" width="0"/></clipPath><text clip-path="url(#cp3)" x="40" y="42" fill="#EA4335">Heals itself when the app changes.</text><clipPath id="cp4"><rect class="c4" x="40" y="12" height="40" width="0"/></clipPath><text clip-path="url(#cp4)" x="40" y="42" fill="#A78BFA">Ships only what really worked.</text>
</svg>