<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="A four-scene story: manual invoice entry, recording it once, Understudy blocking a rule-breaking typo, and a verified run">
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .p{animation:in 14s infinite both}
      .p2{animation-delay:1.2s}.p3{animation-delay:2.4s}.p4{animation-delay:3.6s}
      @keyframes in{0%{opacity:0;transform:translateY(16px)}6%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
      .rec{animation:rec 1.2s infinite}
      @keyframes rec{50%{fill-opacity:.25}}
      .shake{animation:shake 2.8s infinite;transform-origin:750px 140px}
      @keyframes shake{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(-6deg)}78%{transform:rotate(6deg)}82%{transform:rotate(-4deg)}86%{transform:rotate(0)}}
      .tick{stroke-dasharray:90;stroke-dashoffset:90;animation:tick 14s infinite both;animation-delay:3.6s}
      @keyframes tick{0%,4%{stroke-dashoffset:90}12%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:90}}
      @media (prefers-reduced-motion: reduce){.p,.rec,.shake,.tick{animation:none;opacity:1;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="20" fill="#0B1020"/>

  <!-- scene 1 -->
  <g class="p">
    <rect x="20" y="20" width="275" height="290" rx="16" fill="#151C31" stroke="#2A3352"/>
    <text x="40" y="52" class="t" font-size="12" font-weight="700" letter-spacing="3" fill="#9AA4BF">SCENE 1 · BEFORE</text>
    <!-- clock -->
    <circle cx="120" cy="135" r="42" fill="none" stroke="#9AA4BF" stroke-width="5"/>
    <path d="M120 135 V108 M120 135 L140 148" stroke="#F3F5FA" stroke-width="5" stroke-linecap="round"/>
    <!-- paper stack -->
    <g fill="#F3F5FA">
      <rect x="185" y="150" width="70" height="12" rx="3" fill-opacity=".9"/>
      <rect x="180" y="136" width="70" height="12" rx="3" fill-opacity=".75"/>
      <rect x="188" y="122" width="70" height="12" rx="3" fill-opacity=".6"/>
      <rect x="182" y="108" width="70" height="12" rx="3" fill-opacity=".45"/>
      <rect x="186" y="94" width="70" height="12" rx="3" fill-opacity=".3"/>
    </g>
    <text x="40" y="222" class="t" font-size="17" font-weight="700" fill="#F3F5FA">The job lives in one head</text>
    <text class="t" font-size="14" fill="#9AA4BF"><tspan x="40" y="248">Every invoice is keyed into the</tspan><tspan x="40" y="268">AP portal by hand. The rules sit</tspan><tspan x="40" y="288">in a PDF nobody re-reads.</tspan></text>
  </g>

  <!-- scene 2 -->
  <g class="p p2">
    <rect x="315" y="20" width="275" height="290" rx="16" fill="#151C31" stroke="#2A3352"/>
    <text x="335" y="52" class="t" font-size="12" font-weight="700" letter-spacing="3" fill="#4285F4">SCENE 2 · REHEARSAL</text>
    <rect x="370" y="88" width="165" height="100" rx="12" fill="none" stroke="#4285F4" stroke-width="4"/>
    <path d="M440 118 L475 138 L440 158Z" fill="#4285F4"/>
    <circle class="rec" cx="520" cy="102" r="8" fill="#EA4335"/>
    <text x="335" y="222" class="t" font-size="17" font-weight="700" fill="#F3F5FA">Show it once</text>
    <text class="t" font-size="14" fill="#9AA4BF"><tspan x="335" y="248">Record the screen while doing it,</tspan><tspan x="335" y="268">paste the SOP. Gemini watches and</tspan><tspan x="335" y="288">checks every field on the live page.</tspan></text>
  </g>

  <!-- scene 3 -->
  <g class="p p3">
    <rect x="610" y="20" width="275" height="290" rx="16" fill="#151C31" stroke="#2A3352"/>
    <text x="630" y="52" class="t" font-size="12" font-weight="700" letter-spacing="3" fill="#FBBC04">SCENE 3 · PLOT TWIST</text>
    <g class="shake">
      <path d="M750 80 L800 100 V140 C800 172 778 190 750 200 C722 190 700 172 700 140 V100Z" fill="#FBBC04" fill-opacity=".15" stroke="#FBBC04" stroke-width="4"/>
      <text x="750" y="148" class="t" font-size="20" font-weight="800" text-anchor="middle" fill="#FBBC04">$7,500</text>
      <path d="M722 160 L778 120" stroke="#EA4335" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="630" y="222" class="t" font-size="17" font-weight="700" fill="#F3F5FA">The SOP takes the stage</text>
    <text class="t" font-size="14" fill="#9AA4BF"><tspan x="630" y="248">A typo breaks the $5,000 limit.</tspan><tspan x="630" y="268">Govern blocks it before anything</tspan><tspan x="630" y="288">touches the real system.</tspan></text>
  </g>

  <!-- scene 4 -->
  <g class="p p4">
    <rect x="905" y="20" width="275" height="290" rx="16" fill="#151C31" stroke="#34A853"/>
    <text x="925" y="52" class="t" font-size="12" font-weight="700" letter-spacing="3" fill="#34A853">SCENE 4 · CURTAIN CALL</text>
    <circle cx="1042" cy="138" r="52" fill="#34A853" fill-opacity=".14" stroke="#34A853" stroke-width="4"/>
    <path class="tick" d="M1018 140 L1036 158 L1068 120" fill="none" stroke="#34A853" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="925" y="222" class="t" font-size="17" font-weight="700" fill="#F3F5FA">Verified, then shipped</text>
    <text class="t" font-size="14" fill="#9AA4BF"><tspan x="925" y="248">Every step passes, the record is</tspan><tspan x="925" y="268">in the ledger, and the ZIP carries</tspan><tspan x="925" y="288">code, rules and evidence.</tspan></text>
  </g>
</svg>
