[pytest]
# `python -m pytest` runs every suite in tests/. Live-server suites (tests/wizard_helpers.LiveServer) start their own
# backend on a free port; suites that need Playwright Chromium, Node.js or Docker skip themselves when it is missing.
testpaths = tests
norecursedirs = __pycache__ .* node_modules
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::PendingDeprecationWarning
